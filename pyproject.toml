[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "locaforge"
version = "0.5.1"
description = "Local-first AI CAT platform for software localization."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "LocaForge contributors" }]
dependencies = ["PySide6>=6.8", "rapidfuzz>=3.14,<4"]

[project.gui-scripts]
locaforge = "locaforge.app.bootstrap:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.16"]
experiment = [
    "Cython==3.2.9",
    "Nuitka==4.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --basetemp=.pytest_tmp"
markers = [
    "unit: fast tests without Qt, SQLite, containers, or external I/O",
    "integration: tests that exercise formats, SQLite, project containers, or workflows",
    "gui: tests that construct or coordinate Qt presentation objects",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["locaforge"]

[tool.hatch.build.targets.wheel]
packages = ["src/locaforge"]
