name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check language pairs and links
        run: python scripts/check_docs.py

  static-quality:
    # Keep this check name stable: main branch protection requires it.
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get install --yes libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get install --yes libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Run fast unit tests
        run: python -m pytest -m unit -n auto --durations=10
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get install --yes libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Run integration tests in parallel
        run: python -m pytest -m integration -n auto --durations=10
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

  gui-tests:
    name: GUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get install --yes libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Run GUI tests sequentially
        run: python -m pytest -m gui --durations=10
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  windows-portable:
    name: Windows portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[build]"
      - name: Build portable archive
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\LocaForge\LocaForge.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LocaForge.exe smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Test packaged project lifecycle
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\LocaForge\LocaForge.exe" -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LocaForge.exe project lifecycle test failed with exit code $($process.ExitCode)"
          }
      - name: Locate portable archive
        id: archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath dist -Filter "LocaForge-*-windows-x64.zip" -File
          if ($archive.Count -ne 1) {
            throw "Expected exactly one portable archive, found $($archive.Count)"
          }
          "path=$($archive.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [documentation, static-quality, unit-tests, integration-tests, gui-tests, package, windows-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          version=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: release-assets
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --verify-tag
          --title "LocaForge ${GITHUB_REF_NAME#v}"
          --generate-notes
